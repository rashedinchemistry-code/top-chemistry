<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | TOP CHEMISTRY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eaf7f0, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #0b3d2e;
      margin-bottom: 10px;
      direction: ltr;
    }

    .logo span {
      color: #65d69b;
    }

    .subtitle {
      text-align: center;
      color: #68736f;
      margin-bottom: 30px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #14201c;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5ded9;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b3d2e;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0b3d2e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #146b4f;
      transform: translateY(-2px);
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 18px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.7;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #a52222;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0b3d2e;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    .demo {
      text-align: center;
      color: #68736f;
      font-size: 13px;
      line-height: 1.8;
      margin-top: 20px;
      direction: rtl;
    }
  </style>
</head>

<body>

  <main class="login-box">

    <div class="logo">
      TOP <span>CHEMISTRY</span>
    </div>

    <p class="subtitle">
      تسجيل الدخول إلى حسابك
    </p>

    <form id="loginForm">

      <label for="phone">رقم الموبايل</label>

      <input
        type="tel"
        id="phone"
        placeholder="أدخل رقم الموبايل"
        autocomplete="username"
        required
      >

      <label for="password">كلمة المرور</label>

      <input
        type="password"
        id="password"
        placeholder="أدخل كلمة المرور"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        تسجيل الدخول
      </button>

      <div
        id="message"
        class="message"
        role="alert"
      ></div>

    </form>

    <a href="index.html" class="back">
      ← العودة للرئيسية
    </a>

    <div class="demo">
      بيانات تجريبية فقط<br>
      رقم الموبايل: 01000000000<br>
      كلمة المرور: 123456
    </div>

  </main>

  <script>
    const testPhone = "01000000000";
    const testPassword = "123456";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;

      if (phone === testPhone && password === testPassword) {

        // الرجوع للرئيسية والانتقال لقسم الكورسات
        window.location.href = "./index.html#courses";

      } else {

        message.textContent =
          "رقم الموبايل أو كلمة المرور غير صحيحة.";

        message.className = "message error";
      }
    });
  </script>

</body>
</html>
